apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smart-table-api
  namespace: smart-table
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smart-table-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
