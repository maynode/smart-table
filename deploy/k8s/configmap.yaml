apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-table-config
  namespace: smart-table
data:
  PUBLIC_FORM_BASE_URL: https://table.example.com
  SUBMIT_MODE: sync
  SUBMIT_MAX_CONCURRENCY: "64"
  S3_DRIVER: minio
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: smart-table
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
