apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-table-web
  namespace: smart-table
  labels:
    app.kubernetes.io/name: smart-table-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-table-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-table-web
    spec:
      containers:
        - name: web
          image: smart-table-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smart-table-web
  namespace: smart-table
spec:
  selector:
    app.kubernetes.io/name: smart-table-web
  ports:
    - name: http
      port: 80
      targetPort: http
