name: smart-table

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-table-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarttable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarttable_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-smarttable}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: smart-table-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-smarttable}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-smarttable_dev_password}
      DB_NAME: ${POSTGRES_DB:-smarttable}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      ADMIN_USERS: ${POSTGRES_USER:-smarttable}
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: smart-table-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: smart-table-clickhouse
    restart: unless-stopped
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-smart_table}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhousedata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # --- Product stack: API, web, claim worker -------------------------------
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    image: smart-table-api:local
    container_name: smart-table-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-smarttable}:${POSTGRES_PASSWORD:-smarttable_dev_password}@pgbouncer:5432/${POSTGRES_DB:-smarttable}?pgbouncer=true&connection_limit=10"
      DIRECT_DATABASE_URL: "postgresql://${POSTGRES_USER:-smarttable}:${POSTGRES_PASSWORD:-smarttable_dev_password}@postgres:5432/${POSTGRES_DB:-smarttable}"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-replace-before-prod!!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      S3_DRIVER: ${S3_DRIVER:-filesystem}
      S3_LOCAL_DIR: /data/s3
      S3_BUCKET: ${S3_BUCKET:-smart-table}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-smarttable}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-smarttable_dev_password}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      PUBLIC_FORM_BASE_URL: ${PUBLIC_FORM_BASE_URL:-http://127.0.0.1:8080}
      PUBLIC_SUBMIT_RATE_LIMIT: ${PUBLIC_SUBMIT_RATE_LIMIT:-30}
      SUBMIT_MAX_CONCURRENCY: ${SUBMIT_MAX_CONCURRENCY:-64}
      SUBMIT_MODE: ${SUBMIT_MODE:-sync}
      AUTOMATION_QUEUE: inline
      ANALYTICS_ADAPTER: ${ANALYTICS_ADAPTER:-postgres}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-smart_table}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      WEB_ORIGIN: ${PUBLIC_FORM_BASE_URL:-http://127.0.0.1:8080}
      WECOM_ENABLED: ${WECOM_ENABLED:-false}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_SECRET: ${WECOM_SECRET:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_REDIRECT_URI: ${WECOM_REDIRECT_URI:-http://127.0.0.1:8080/login}
      INSTALL_ADMIN_EMAILS: ${INSTALL_ADMIN_EMAILS:-}
      QUOTA_MAX_SEATS: ${QUOTA_MAX_SEATS:-50}
      QUOTA_MAX_STORAGE_BYTES: ${QUOTA_MAX_STORAGE_BYTES:-10737418240}
      QUOTA_MAX_AUTOMATION_RUNS_PER_MONTH: ${QUOTA_MAX_AUTOMATION_RUNS_PER_MONTH:-10000}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-smart-table-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    command: ["sh", "/app/deploy/entrypoint-api.sh"]
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - claimdata:/data/s3
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: smart-table-web:local
    container_name: smart-table-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  claim-worker:
    image: smart-table-api:local
    container_name: smart-table-claim-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-smarttable}:${POSTGRES_PASSWORD:-smarttable_dev_password}@pgbouncer:5432/${POSTGRES_DB:-smarttable}?pgbouncer=true&connection_limit=10"
      DIRECT_DATABASE_URL: "postgresql://${POSTGRES_USER:-smarttable}:${POSTGRES_PASSWORD:-smarttable_dev_password}@postgres:5432/${POSTGRES_DB:-smarttable}"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-replace-before-prod!!}
      S3_DRIVER: ${S3_DRIVER:-filesystem}
      S3_LOCAL_DIR: /data/s3
      AUTOMATION_QUEUE: bullmq
      PUBLIC_FORM_BASE_URL: ${PUBLIC_FORM_BASE_URL:-http://127.0.0.1:8080}
    command: ["node", "apps/api/dist/worker.js"]
    volumes:
      - claimdata:/data/s3

  # MinIO is opt-in: only needed when S3_DRIVER=minio.
  #   docker compose --profile object-storage up -d
  # In restricted networks, load a MinIO image locally and point MINIO_IMAGE at it.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-10-13T13-34-11Z}
    container_name: smart-table-minio
    profiles: ["object-storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smarttable}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smarttable_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2024-10-08T09-37-26Z}
    container_name: smart-table-minio-init
    profiles: ["object-storage"]
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
        exit 0
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smarttable}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smarttable_dev_password}
      S3_BUCKET: ${S3_BUCKET:-smart-table}
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: smart-table-otel
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_GRPC_PORT:-4317}:4317"

volumes:
  pgdata:
  redisdata:
  miniodata:
  clickhousedata:
  claimdata:
